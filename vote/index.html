<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>crayon CUDP 새 이름 후보 검토 결과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=6">
</head>
<body>
<main class="wrap">
  <nav class="pages" aria-label="페이지">
    <a href="../">1. 공모</a>
    <a href="./" aria-current="page">2. 검토</a>
    <a data-tab="vote" data-href="./ballot.html">3. 투표</a>
    <a data-tab="result" data-href="./result.html">4. 결과</a>
  </nav>

  <h1>crayon CUDP,<br>새 이름 후보를 확인해 주세요</h1>

  <p id="notice" class="notice" role="status" hidden></p>

  <div id="content" class="stack">
    <p id="vote-open" class="notice" role="status" hidden>투표 탭이 열렸습니다. 아래 후보를 확인한 뒤 투표를 진행해 주세요.</p>
    <section class="board" aria-labelledby="final-title">
      <h2 id="final-title">투표 후보</h2>
      <ul id="finals"></ul>
      <a id="go-vote" class="primary" href="./ballot.html" hidden>투표하러 가기</a>
    </section>

    <section class="board" aria-labelledby="review-title">
      <div class="board-head">
        <h2 id="review-title">상표 검토 결과</h2>
        <a class="report-link" href="https://claude.ai/artifact/JF243qeYjuyXjn8sMwM7iT" target="_blank" rel="noopener" aria-label="상세 검토 보고서 보기, 새 창에서 열림">상세 검토 보고서 보기 ↗</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th scope="col">이름</th><th scope="col">이름 의미</th><th scope="col">결과</th><th scope="col">사유</th></tr>
          </thead>
          <tbody id="reviews"></tbody>
        </table>
      </div>
      <p class="note">사내 검토 결과이며, 실제 상표 등록 가능 여부를 보장하지 않습니다.</p>
    </section>
  </div>
</main>
<script type="module" src="./review.js?v=8"></script>
</body>
</html>

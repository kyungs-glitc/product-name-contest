<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>crayon CUDP 새 이름 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<main class="wrap">
  <nav class="pages" aria-label="페이지">
    <a href="../">1. 공모</a>
    <a data-tab="review" data-href="./">2. 검토</a>
    <a href="./ballot.html" aria-current="page">3. 투표</a>
    <a data-tab="result" data-href="./result.html">4. 결과</a>
  </nav>

  <h1>crayon CUDP,<br>새 이름에 투표해 주세요</h1>

  <form id="form" autocomplete="off">
    <div class="voter">
      <label for="f-voter">내 이름 (고른 후보는 담당자만 봅니다. 투표 여부는 아래 현황에 공개됩니다)</label>
      <select id="f-voter" required></select>
    </div>
    <fieldset>
      <legend><span>마음에 드는 이름을 2개 체크해 주세요</span><span id="picked" class="picked"></span></legend>
      <div id="choices"></div>
    </fieldset>
    <button id="f-submit" class="primary" type="submit">투표하기</button>
    <p id="status" class="status" role="status"></p>
  </form>
  <p id="notice" class="notice" role="status" hidden></p>

  <section class="board" aria-labelledby="board-title">
    <div class="board-head">
      <h2 id="board-title">투표 현황</h2>
      <p id="tally" class="tally"></p>
    </div>
    <p id="status-note" class="note" role="status" hidden></p>
    <ul id="people"></ul>
  </section>
</main>
<script type="module" src="../nav.js?v=3"></script>
<script type="module" src="./ballot.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>crayon CUDP 새 이름 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 공모 페이지와 같은 색과 글꼴. 한 칸짜리 투표 화면이다. */
:root{
  color-scheme:dark;
  --bg:#050913; --panel:#0A1124; --line:#1E3A8A; --line2:#2B4BA8; --accent:#4F86FF;
  --text:#C9D6F5; --strong:#EAF0FF; --muted:#7385BB;
  --ok:#3FBF78; --warn:#E9B419; --bad:#F0705A;
  --sans:"IBM Plex Sans KR","Pretendard",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0;color:var(--text);font:400 16px/1.6 var(--sans);word-break:keep-all;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(30,58,138,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(30,58,138,.16) 1px,transparent 1px);
  background-size:64px 64px;
}
.wrap{max-width:720px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-direction:column;gap:32px}
h1,h2,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:clamp(32px,5vw,44px);line-height:1.2;font-weight:700;color:var(--strong);text-wrap:balance}

form{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
fieldset{border:0;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px}
legend,label[for]{font-size:14px;font-weight:500;padding:0;margin-bottom:8px}
#choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 16px;cursor:pointer}
.choice:hover{border-color:var(--line2)}
.choice:has(input:checked){border-color:var(--accent)}
.choice input{width:18px;height:18px;margin:5px 0 0;accent-color:var(--accent);flex:none}
.choice-text{display:flex;flex-direction:column;min-width:0}
.nm{font-size:20px;line-height:1.4;font-weight:700;color:var(--strong);overflow-wrap:anywhere;word-break:normal}
.why{font-size:14px;overflow-wrap:anywhere}
.voter{width:100%}
.voter select{font:inherit;color:var(--strong);width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.voter select:focus{outline:0;border-color:var(--accent)}
.primary{font:inherit;cursor:pointer;background:var(--accent);color:var(--bg);font-weight:700;border:0;border-radius:4px;padding:10px 24px}
.primary:hover:not(:disabled){background:#6F98FF}
.primary:disabled{opacity:.5;cursor:default}
.status{min-height:26px;font-size:14px}
.status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
.notice{border:1px solid var(--line2);border-left:4px solid var(--accent);background:var(--panel);padding:16px;border-radius:4px;color:var(--strong)}

.rules{border:1px solid var(--line);background:var(--panel);padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.rules h2{font:500 13px/1.5 var(--sans);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;gap:10px;align-items:baseline}
.steps .no{font:400 13px var(--mono);color:var(--muted)}
.steps .now{color:var(--strong);font-weight:500}
.steps .now .no{color:var(--accent)}
.tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--line2);border-radius:3px;padding:0 6px;line-height:1.6;font-weight:400}

.board{display:flex;flex-direction:column;gap:12px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.board h2{font-size:22px;font-weight:700;color:var(--strong)}
.tally{font:400 14px var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
.note{color:var(--muted)}
#people{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.person{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-wrap:anywhere}
.person.done{border-color:var(--ok);color:var(--strong)}
.person.done .tag{color:var(--ok);border-color:var(--ok)}
.person .tag{flex:none}
.tag.wait{color:var(--muted)}

@media (max-width:760px){.wrap{padding:28px 16px 48px;gap:24px}}
</style>
</head>
<body>
<main class="wrap">
  <h1>crayon CUDP,<br>새 이름에 투표해 주세요</h1>

  <form id="form" autocomplete="off">
    <fieldset>
      <legend>가장 마음에 드는 이름</legend>
      <div id="choices"></div>
    </fieldset>
    <div class="voter">
      <label for="f-voter">투표자 이름 (고른 이름은 담당자만 봅니다. 투표 여부는 아래 현황에 공개됩니다)</label>
      <select id="f-voter" required></select>
    </div>
    <button id="f-submit" class="primary" type="submit">투표하기</button>
    <p id="status" class="status" role="status"></p>
  </form>
  <p id="notice" class="notice" role="status" hidden></p>

  <section class="board" aria-labelledby="board-title">
    <div class="board-head">
      <h2 id="board-title">투표 현황</h2>
      <p id="tally" class="tally"></p>
    </div>
    <p id="status-note" class="note" role="status" hidden></p>
    <ul id="people"></ul>
  </section>

  <section class="rules">
    <h2>진행 순서</h2>
    <ol class="steps">
      <li><span class="no">1</span>이름 응모</li>
      <li><span class="no">2</span>상표 검색으로 후보 추리기</li>
      <li class="now"><span class="no">3</span>전 직원 투표 <span class="tag">지금</span></li>
    </ol>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>

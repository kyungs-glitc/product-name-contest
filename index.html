<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>crayon CUDP 새 이름 공모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 배치: 왼쪽은 응모 입력, 오른쪽은 올라온 이름을 점으로 찍는 레이더, 아래는 전체 목록.
   어두운 화면 하나로 고정한다. */
:root{
  color-scheme:dark;
  --bg:#050913; --panel:#0A1124; --line:#1E3A8A; --line2:#2B4BA8; --accent:#4F86FF;
  --text:#C9D6F5; --strong:#EAF0FF; --muted:#7385BB;
  --ok:#3FBF78; --warn:#E9B419; --bad:#F0705A;
  --sans:"IBM Plex Sans KR","Pretendard",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0;color:var(--text);font:400 16px/1.6 var(--sans);word-break:keep-all;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(30,58,138,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(30,58,138,.16) 1px,transparent 1px);
  background-size:64px 64px;
}
.wrap{max-width:1040px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-direction:column;gap:40px}
h1,h2,p,ol{margin:0}
ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:clamp(32px,5vw,48px);line-height:1.2;font-weight:700;color:var(--strong);text-wrap:balance}

.pages{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.pages a{padding:8px 14px;margin-bottom:-1px;font-size:14px;color:var(--text);text-decoration:none;border-bottom:2px solid transparent}
.pages a[href]:hover{color:var(--strong)}
.pages a[aria-disabled="true"]{color:var(--muted);opacity:.6;cursor:not-allowed}
.pages a[aria-current="page"]{color:var(--strong);font-weight:700;border-bottom-color:var(--accent)}

.top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:center}
form{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
label{font-size:14px;font-weight:500;color:var(--text)}
input,textarea{font:inherit;color:var(--strong);width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.name-input{
  background:transparent;border:0;border-bottom:2px solid var(--line2);border-radius:0;padding:4px 0 8px;
  font-size:clamp(28px,4.4vw,40px);font-weight:700;line-height:1.3;caret-color:var(--accent);
}
.name-input:focus{outline:0;border-bottom-color:var(--accent)}
textarea,.who-input{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px}
textarea{resize:vertical;min-height:72px}
textarea:focus,.who-input:focus{outline:0;border-color:var(--accent)}
.submit-row{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.timer{font-size:14px;display:flex;flex-direction:column;line-height:1.4}
.timer-label{font-size:13px;color:var(--muted)}
.timer b{font:500 15px var(--mono);color:var(--warn);font-variant-numeric:tabular-nums}
.status{min-height:26px;font-size:14px}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
.primary{font:inherit;cursor:pointer;background:var(--accent);color:var(--bg);font-weight:700;border:0;border-radius:4px;padding:10px 24px}
.primary:hover:not(:disabled){background:#6F98FF}
.primary:disabled{opacity:.5;cursor:default}
.blocked{border:1px solid var(--line2);border-left:4px solid var(--warn);background:var(--panel);padding:16px;border-radius:4px;color:var(--strong);white-space:pre-line}

.scope{position:relative;aspect-ratio:1;width:100%;max-width:340px;margin-inline:auto;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#0C1B42 0,#060D22 72%)}
.scope svg{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 270deg,rgba(79,134,255,.34) 360deg);animation:spin 6s linear infinite}
.sweep::after{content:"";position:absolute;left:50%;top:0;width:1px;height:50%;background:#A6D4FF;opacity:.8}
.blip{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#BFE6FF;box-shadow:0 0 8px 2px rgba(79,134,255,.8);animation:ping 6s linear infinite;opacity:.4}
.scope-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scope-center b{font:500 clamp(40px,6vw,56px)/1 var(--mono);color:var(--strong);font-variant-numeric:tabular-nums}
.scope-center span{font-size:13px;color:var(--text);margin-top:4px}
.north{position:absolute;top:6%;left:0;right:0;text-align:center;font:500 12px/1 var(--mono);color:#AFC2EE;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{opacity:1}55%,100%{opacity:.4}}

.tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--line2);border-radius:3px;padding:0 6px;line-height:1.6;font-weight:400}
.tag.bad{color:var(--bad);border-color:var(--bad)}

.board{display:flex;flex-direction:column;gap:12px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.board h2{font-size:22px;font-weight:700;color:var(--strong)}
.tally{font:400 14px var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
.note{padding:24px 0;color:var(--muted);border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1.6fr);gap:6px 20px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.row .no{font:400 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{font-size:22px;line-height:1.35;font-weight:700;color:var(--strong);overflow-wrap:anywhere;word-break:normal}
.row .why{overflow-wrap:anywhere}
.row .why .tag{display:table;margin-top:4px}

@media (max-width:760px){
  .wrap{padding:28px 16px 48px;gap:32px}
  .top{grid-template-columns:minmax(0,1fr);gap:32px}
  .scope{max-width:260px}
  .row{grid-template-columns:52px minmax(0,1fr)}
  .row .why{grid-column:2}
}
@media (prefers-reduced-motion:reduce){
  .sweep{animation:none}
  .blip{animation:none;opacity:1}
}
</style>
</head>
<body>
<main class="wrap">
  <nav class="pages" aria-label="페이지">
    <a href="./" aria-current="page">1. 공모</a>
    <a data-tab="review" data-href="./vote/">2. 검토</a>
    <a data-tab="vote" data-href="./vote/ballot.html">3. 투표</a>
    <a data-tab="result" data-href="./vote/result.html">4. 결과</a>
  </nav>

  <h1>crayon CUDP,<br>이 제품의 새 이름을 정해 주세요</h1>

  <section class="top">
    <div>
      <form id="form" autocomplete="off">
        <label for="f-name">제품 이름</label>
        <input id="f-name" class="name-input" maxlength="30" required placeholder="이름을 적어 주세요">
        <p id="status" class="status" role="status"></p>
        <label for="f-why">이름 의미</label>
        <textarea id="f-why" rows="2" maxlength="200" required placeholder="이 이름에 담은 뜻을 한두 문장으로 적어 주세요"></textarea>
        <label for="f-who">제안자 이름 (선택, 목록에 표시되지 않습니다)</label>
        <input id="f-who" class="who-input" maxlength="30">
        <div class="submit-row">
          <button id="f-submit" class="primary" type="submit">제출하기</button>
          <p class="timer" role="timer"><span class="timer-label" id="timer-label"></span> <b id="timer"></b></p>
        </div>
      </form>
      <p id="closed" class="blocked" role="status" hidden></p>
    </div>
    <div aria-hidden="true">
      <div class="scope">
        <svg viewBox="0 0 100 100" fill="none" stroke="#2B4BA8" stroke-width=".35">
          <circle cx="50" cy="50" r="49.6"/><circle cx="50" cy="50" r="33"/><circle cx="50" cy="50" r="16.5"/>
          <path d="M50 0V100M0 50H100" stroke="#1E3A8A"/>
        </svg>
        <div class="sweep"></div>
        <div id="blips"></div>
        <div class="north">N</div>
        <div class="scope-center"><b id="scope-count">0</b><span>개의 이름</span></div>
      </div>
    </div>
  </section>

  <section class="board" aria-labelledby="board-title">
    <div class="board-head">
      <h2 id="board-title">올라온 이름</h2>
      <p id="tally" class="tally"></p>
    </div>
    <p id="list-note" class="note" role="status">목록을 불러오는 중입니다.</p>
    <ol id="list"></ol>
  </section>
</main>
<script type="module" src="./app.js?v=5"></script>
</body>
</html>
